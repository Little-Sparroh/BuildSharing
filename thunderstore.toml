[config]
schemaVersion = "0.0.1"

[package]
namespace = "Sparroh"
name = "BuildSharing"
description = "Copy and paste gear upgrade grid layouts as compact shareable codes."
websiteUrl = "https://github.com/Little-Sparroh/BuildSharing"
containsNsfwContent = false

[package.dependencies]
BepInEx-BepInExPack_Mycopunk = "5.4.2403"
Sparroh-SparrohUILib = "1.1.1"


[build]
icon = "icon.png"
readme = "README.md"
outdir = "build"

[[build.copy]]
source = "bin/Release/netstandard2.1/BuildSharing.dll"
target = "BepInEx/plugins/BuildSharing.dll"

[[build.copy]]
source = "CHANGELOG.md"
target = "CHANGELOG.md"

[[build.copy]]
source = "LICENSE"
target = "LICENSE"

[publish]
repository = "https://thunderstore.io"
communities = ["mycopunk"]

[publish.categories]
mycopunk = ["client"]
